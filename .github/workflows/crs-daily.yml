name: CRS cross-asset risk monitor

on:
  workflow_dispatch:
  schedule:
    # Weekdays after the US close. GitHub schedules use UTC.
    - cron: '30 23 * * 1-5'

permissions:
  contents: read

concurrency:
  group: crs-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: nq_sentinel_pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: nq_sentinel_pro/data/crs/state.json
          key: crs-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: crs-state-${{ github.ref_name }}-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and run offline tests
        run: |
          python -m compileall -q sentinel tests local_crs_portfolio.py
          python -m unittest discover -s tests -v
      - name: Collect data and write daily reports
        id: monitor
        shell: bash
        run: |
          set +e
          as_of="$(python -m sentinel.crs.market_calendar)"
          calendar_result=$?
          set -e
          if [ "$calendar_result" -ne 0 ] || [ -z "$as_of" ]; then
            {
              echo "## CRS daily report"
              echo "- Pipeline status: **PIPELINE_FAILED**"
              echo "- Reason: latest completed XNYS session could not be resolved."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          set +e
          python -m sentinel.crs.cli --as-of "$as_of"
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            {
              echo "## CRS daily report"
              echo "- Pipeline status: **PIPELINE_FAILED**"
              echo "- CLI exit code: `$result`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          fi
          if ! python -m sentinel.crs.actions_summary \
            --report "reports/crs/CRS_DAILY_${as_of}.json" \
            --summary "$GITHUB_STEP_SUMMARY"; then
            {
              echo "## CRS daily report"
              echo "- Pipeline status: **PIPELINE_FAILED**"
              echo "- Reason: report summary could not be generated."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Summarize pre-monitor pipeline failure
        if: failure() && steps.monitor.outcome == 'skipped'
        shell: bash
        run: |
          {
            echo "## CRS daily report"
            echo "- Pipeline status: **PIPELINE_FAILED**"
            echo "- Reason: dependency installation or offline compile/tests failed before data collection."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.monitor.outcome != 'skipped'
        with:
          name: crs-daily-${{ github.run_id }}
          path: |
            nq_sentinel_pro/reports/crs/*.json
            nq_sentinel_pro/reports/crs/*.md
            nq_sentinel_pro/reports/crs/*.html
          if-no-files-found: warn
          retention-days: 90
