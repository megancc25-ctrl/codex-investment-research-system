name: CRS cross-asset risk monitor
on:
  workflow_dispatch:
  schedule:
    # Existing schedule retained; independent of the ChatGPT 08:00 task.
    - cron: '30 23 * * 1-5'
permissions:
  contents: read
concurrency:
  group: crs-daily-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nq_sentinel_pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Existing and new offline tests
        run: python -m unittest discover -s tests -v
      - name: Restore engineering report archive
        uses: actions/cache@v4
        with:
          path: nq_sentinel_pro/reports/crs
          key: crs-engineering-archive-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: crs-engineering-archive-${{ github.ref_name }}-
      - name: Write blocked-data diagnostic (no live data or credentials)
        run: |
          python -m sentinel.crs.delivery
          echo 'CRS engineering diagnostic generated. Formal risk score N/A; live data not admitted.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: crs-engineering-diagnostic-${{ github.run_id }}
          path: nq_sentinel_pro/reports/crs/
          if-no-files-found: error
          retention-days: 90
